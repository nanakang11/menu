*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:15px;font-weight:500;color:var(--sub);margin:0 0 4px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px}
.when{font-size:14px;color:var(--accent);font-weight:500;margin:0}
.main-dish{font-size:24px;font-weight:800;line-height:1.3;margin:2px 0 10px;word-break:keep-all}
.sides{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.sides li{background:var(--bg);border-radius:6px;padding:3px 10px;font-size:14px}
.corner{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.corner:first-child{margin-top:8px;padding-top:0;border-top:0}
.corner b{display:inline-block;font-size:13px;font-weight:500;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 10px;margin-bottom:6px}
.row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.row button{flex:1 0 auto;min-width:44px;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.row button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.row button.today:not([aria-pressed=true]){background:var(--soft)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.togo{list-style:none;margin:0;padding:0}
.togo li{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.togo li:last-child{border-bottom:0}
.togo span{flex:0 0 52px;font-size:12px;font-weight:500;color:var(--sub)}
#days{overflow:visible}
#days button{white-space:pre-line;flex:1 1 0;min-width:0;padding:6px 0;line-height:1.3;font-size:13px}
.note{font-size:12px;color:var(--sub);margin-top:18px}
</style>

const blk=(n,a)=>'<div class="corner"><b>'+n+'</b><p class="main-dish">'+a[0]+'</p><ul class="sides">'+a.slice(1).map(x=>"<li>"+x+"</li>").join("")+"</ul></div>";
const TG=meal==="조식"?TO[day]:meal==="중식"?TL[day]:[];
const tg=TG.length?'<div class="corner"><b>To Go 코너 · 택1</b><ol class="togo">'+TG.map((x,i)=>"<li><span>To Go "+(i+1)+"</span>"+x+"</li>").join("")+"</ol></div>":"";
$("body").innerHTML=blk(meal==="중식"?"A코너":"오늘의 메뉴",c.A)+(c.B?blk("B코너",c.B):"")+tg}
render();
